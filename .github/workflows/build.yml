name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Устанавливаем корректную версию Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 2. Устанавливаем Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Принудительно устанавливаем готовый Android SDK с валидным Build-Tools (содержит aidl)
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 4. Системные зависимости Linux
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git zip unzip zlib1g-dev libssl-dev libffi-dev libltdl-dev libncurses5

    # 5. Установка Buildozer и Cython
    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    # 6. Генерация и настройка buildozer.spec
    - name: Initialize and configure Buildozer
      run: |
        buildozer init
        sed -i 's/title = My Application/title = Grape Notes/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = grapenotes/g' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = org.grape/g' buildozer.spec
        sed -i 's/^requirements = .*/requirements = python3,kivy,charset-normalizer/g' buildozer.spec
        
        # Указываем Buildozer использовать предустановленный Android SDK
        sed -i 's/# android.api = 31/android.api = 33/g' buildozer.spec
        sed -i 's/# android.accept_sdk_licenses = False/android.accept_sdk_licenses = True/g' buildozer.spec
        sed -i "s|# android.sdk_path =|android.sdk_path = $ANDROID_HOME|g" buildozer.spec

    # 7. Запуск сборки
    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    # 8. Сохранение готового APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GrapeNotes-APK
        path: bin/*.apk
