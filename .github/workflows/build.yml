name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade buildozer cython

    - name: Initialize Buildozer
      run: |
        buildozer init
        sed -i 's/title = My Application/title = Grape Notes/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = grapenotes/g' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = org.grape/g' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy/g' buildozer.spec
        echo "android.accept_sdk_licenses = True" >> buildozer.spec

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GrapeNotes-APK
        path: bin/*.apk
