name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:master

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix directory permissions
      run: |
        git config --global --add safe.directory /__w/grape-app/grape-app

    - name: Initialize Buildozer
      run: |
        buildozer init
        sed -i 's/title = My Application/title = Grape Notes/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = grapenotes/g' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = org.grape/g' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy/g' buildozer.spec
        echo "android.accept_sdk_licenses = True" >> buildozer.spec

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GrapeNotes-APK
        path: bin/*.apk
