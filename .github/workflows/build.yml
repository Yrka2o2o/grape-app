name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hyuuga-neji/buildozer-action:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Directory Permissions
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Initialize and setup Buildozer
      run: |
        buildozer init
        sed -i 's/title = My Application/title = Grape Notes/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = grapenotes/g' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = org.grape/g' buildozer.spec
        
        # Стабильный набор требований
        sed -i 's/^requirements = .*/requirements = python3,kivy,charset-normalizer/g' buildozer.spec
        
        # Включаем автоматическое подтверждение лицензий
        sed -i 's/# android.accept_sdk_licenses = False/android.accept_sdk_licenses = True/g' buildozer.spec

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GrapeNotes-APK
        path: bin/*.apk
