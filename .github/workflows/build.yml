name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git zip unzip zlib1g-dev libssl-dev libffi-dev libltdl-dev openjdk-17-jdk libncurses5

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Initialize and configure Buildozer
      run: |
        yes | buildozer init
        sed -i 's/title = My Application/title = Grape Notes/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = grapenotes/g' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = org.grape/g' buildozer.spec
        sed -i 's/^requirements = .*/requirements = python3==3.10.12, kivy, charset-normalizer/g' buildozer.spec
        
        # Фиксируем стабильную версию Android API и Build-tools
        sed -i 's/# android.api = 33/android.api = 33/g' buildozer.spec
        sed -i 's/# android.build_tools_version = .*/android.build_tools_version = 33.0.2/g' buildozer.spec
        sed -i 's/# android.accept_sdk_licenses = False/android.accept_sdk_licenses = True/g' buildozer.spec

    # Автоматическое принятие всех лицензий Android SDK
    - name: Accept Android SDK Licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GrapeNotes-APK
        path: bin/*.apk
